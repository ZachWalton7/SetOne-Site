# Supabase free-tier projects pause after ~1 week without DATABASE
# activity, which kills the waitlist silently. Lesson from the Aug 19
# pause: pinging the gateway root (/rest/v1/) does NOT count; it never
# reaches the database, so the project paused despite green runs. The
# ping must query a real table. Publishable key only; RLS means this
# reads nothing. -f makes a dead project fail the run loudly.
name: Supabase keepalive
on:
  schedule:
    - cron: "17 9 * * 1,4"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query waitlist table (real DB activity)
        run: |
          curl -sf -o /dev/null -w "keepalive status %{http_code}\n" \
            "https://pcupaezqkvgetnuwrtcw.supabase.co/rest/v1/waitlist?select=email&limit=1" \
            -H "apikey: sb_publishable_9qztrf-FJOtSv9DBNbMQAA_ZqSpZi8N"
