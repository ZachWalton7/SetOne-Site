# Supabase free-tier projects pause after ~1 week without API activity —
# which would kill the waitlist silently. Two pings a week keeps the
# project awake. Publishable key only; RLS means this can read nothing.
name: Supabase keepalive
on:
  schedule:
    - cron: "17 9 * * 1,4"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping REST endpoint
        run: |
          curl -s -o /dev/null -w "keepalive status %{http_code}\n" \
            "https://pcupaezqkvgetnuwrtcw.supabase.co/rest/v1/" \
            -H "apikey: sb_publishable_9qztrf-FJOtSv9DBNbMQAA_ZqSpZi8N"
